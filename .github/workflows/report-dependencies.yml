name: Report Dependencies to Security Inventory

on:
  push:
    branches:
      - main
      - develop

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml toml

      - name: Collect and send dependencies
        env:
          SECURITY_API_URL: ${{ secrets.SECURITY_API_URL }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import re
          import requests
          import yaml

          repo = os.environ.get("GITHUB_REPOSITORY", "unknown").split("/")[-1]
          rama = os.environ.get("GITHUB_REF_NAME", "unknown")
          api_url = os.environ.get("SECURITY_API_URL")
          dependencies = []

          # npm - package.json
          if os.path.exists("package.json"):
              with open("package.json") as f:
                  pkg = json.load(f)
              for name, version in pkg.get("dependencies", {}).items():
                  dependencies.append({"ecosystem": "npm", "name": name, "version": version.replace("^","").replace("~","")})

          # pip - requirements.txt
          if os.path.exists("requirements.txt"):
              with open("requirements.txt") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#"):
                          match = re.match(r"([a-zA-Z0-9_\-]+)[=><]+([^\s]+)", line)
                          if match:
                              dependencies.append({"ecosystem": "pip", "name": match.group(1), "version": match.group(2)})

          # composer - composer.json (PHP)
          if os.path.exists("composer.json"):
              with open("composer.json") as f:
                  pkg = json.load(f)
              for name, version in pkg.get("require", {}).items():
                  if not name.startswith("php"):
                      dependencies.append({"ecosystem": "composer", "name": name, "version": version.replace("^","").replace("~","")})

          # maven - pom.xml (Java)
          if os.path.exists("pom.xml"):
              with open("pom.xml") as f:
                  content = f.read()
              matches = re.findall(r"<artifactId>(.+?)</artifactId>.*?<version>(.+?)</version>", content, re.DOTALL)
              for name, version in matches:
                  dependencies.append({"ecosystem": "maven", "name": name, "version": version})

          # gradle - build.gradle (Java/Kotlin)
          if os.path.exists("build.gradle"):
              with open("build.gradle") as f:
                  content = f.read()
              matches = re.findall(r"['\"]([a-zA-Z0-9\.\-]+):([a-zA-Z0-9\.\-]+):([0-9][^\s'\"]+)['\"]", content)
              for group, name, version in matches:
                  dependencies.append({"ecosystem": "gradle", "name": f"{group}:{name}", "version": version})

          # nuget - *.csproj (C#)
          import glob
          for csproj in glob.glob("**/*.csproj", recursive=True):
              with open(csproj) as f:
                  content = f.read()
              matches = re.findall(r'PackageReference Include="([^"]+)" Version="([^"]+)"', content)
              for name, version in matches:
                  dependencies.append({"ecosystem": "nuget", "name": name, "version": version})

          # rubygems - Gemfile (Ruby)
          if os.path.exists("Gemfile"):
              with open("Gemfile") as f:
                  content = f.read()
              matches = re.findall(r"gem ['\"]([^'\"]+)['\"].*?['\"]([0-9][^'\"]+)['\"]", content)
              for name, version in matches:
                  dependencies.append({"ecosystem": "rubygems", "name": name, "version": version})

          # cargo - Cargo.toml (Rust)
          if os.path.exists("Cargo.toml"):
              try:
                  import toml
                  with open("Cargo.toml") as f:
                      cargo = toml.load(f)
                  for name, version in cargo.get("dependencies", {}).items():
                      if isinstance(version, str):
                          dependencies.append({"ecosystem": "cargo", "name": name, "version": version.replace("^","")})
                      elif isinstance(version, dict):
                          dependencies.append({"ecosystem": "cargo", "name": name, "version": version.get("version", "unknown")})
              except:
                  pass

          # golang - go.mod
          if os.path.exists("go.mod"):
              with open("go.mod") as f:
                  content = f.read()
              matches = re.findall(r"^\s+([^\s]+)\s+v([^\s]+)", content, re.MULTILINE)
              for name, version in matches:
                  dependencies.append({"ecosystem": "golang", "name": name, "version": version})

          # docker-compose
          if os.path.exists("docker-compose.yml"):
              with open("docker-compose.yml") as f:
                  compose = yaml.safe_load(f)
              services = compose.get("services", {})
              for service, config in services.items():
                  image = config.get("image", "")
                  if image:
                      if ":" in image:
                          name, version = image.split(":", 1)
                      else:
                          name, version = image, "latest"
                      dependencies.append({"ecosystem": "docker", "name": name, "version": version})

          # terraform - *.tf
          for tf_file in glob.glob("**/*.tf", recursive=True):
              with open(tf_file) as f:
                  content = f.read()
              matches = re.findall(r'source\s+=\s+"([^"]+)".*?version\s+=\s+"([^"]+)"', content, re.DOTALL)
              for name, version in matches:
                  dependencies.append({"ecosystem": "terraform", "name": name, "version": version})

          payload = {
              "repo": repo,
              "rama": rama,
              "dependencias": dependencies
          }

          print(f"Encontradas {len(dependencies)} dependencias en {repo}")
          print(json.dumps(payload, indent=2))

          if api_url:
              response = requests.post(f"{api_url}/inventario", json=payload)
              print(f"API response: {response.status_code}")
          else:
              print("SECURITY_API_URL no configurada - solo mostrando dependencias")

          EOF
